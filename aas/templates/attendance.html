{% extends "base.html" %}{% block body %}
<h1>Mark Attendance</h1><p class="sub">Stand in front of the camera. Multiple faces can be recognised at the same time.</p>
<div class="grid g2">
 <div class="card"><div style="position:relative"><video id="v" autoplay playsinline></video>
  <div id="beam" style="display:none;position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22c55e,transparent);box-shadow:0 0 14px #22c55e;top:0;animation:sc 1.6s linear infinite"></div></div>
  <style>@keyframes sc{0%{top:0}100%{top:calc(100% - 3px)}}</style>
  <div id="status" style="margin:10px 0;font-weight:700;color:var(--muted)">Ready</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn" type="button" id="one">🔍 Scan once</button>
   <button class="btn sec" type="button" id="auto">▶ Auto scan (every 3 sec)</button></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Today's Attendance</h3><span class="badge p" id="cnt">0</span></div>
  <div id="log" style="margin-top:12px;display:grid;gap:8px"></div>
  <div id="empty" class="sub">No one yet.</div></div>
</div>
<script>
const v=document.getElementById('v'),st=document.getElementById('status'),log=document.getElementById('log'),beam=document.getElementById('beam');
let timer=null,busy=false,total=0;startCam(v);
function add(m){document.getElementById('empty').style.display='none';total++;document.getElementById('cnt').textContent=total;
 var d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;padding:10px 12px;background:var(--okbg);border-radius:10px;animation:pop .3s';
 d.innerHTML='<b></b><span style="color:var(--muted);font-size:13px"></span>';d.firstChild.textContent='✅ '+m.name+' ('+m.roll+')';d.lastChild.textContent=m.time;log.prepend(d)}
async function scan(silent){
 if(busy)return;var im=snap(v,silent);if(!im)return;busy=true;beam.style.display='block';st.textContent='Scanning...';
 try{var r=await fetch('/api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:im})});var j=await r.json();
  if(!j.ok){st.textContent=j.msg;toast(j.msg,'err')}
  else if(!j.faces){st.textContent='No face detected. Please move closer.'}
  else{j.marked.forEach(function(m){add(m);toast(m.name+' Present ✅','ok')});
   var parts=[];if(j.marked.length)parts.push(j.marked.length+' newly marked');if(j.already.length)parts.push(j.already.join(', ')+' already marked');if(j.unknown)parts.push(j.unknown+' face(s) not recognised');
   st.textContent=parts.join(' • ')}
 }catch(e){st.textContent='Error: '+e.message}
 busy=false;if(!timer)beam.style.display='none'}
document.getElementById('one').onclick=function(){scan(false)};
document.getElementById('auto').onclick=function(){var b=document.getElementById('auto');
 if(timer){clearInterval(timer);timer=null;b.textContent='▶ Auto scan (every 3 sec)';beam.style.display='none';st.textContent='Auto scan stopped'}
 else{timer=setInterval(function(){scan(true)},3000);b.textContent='⏸ Stop auto scan';scan(true)}};
</script>{% endblock %}
